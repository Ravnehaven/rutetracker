<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rutetracker</title>
<meta name="theme-color" content="#0f1117">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --bg: #0f1117; --bg2: #161922; --bg3: #1e293b; --bg4: #0f0815;
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --blue: #2563eb; --blue2: #60a5fa; --blue3: #93c5fd; --bluebg: #1e3a5f;
  --green: #16a34a; --greenbg: #0a2e1a; --red: #dc2626; --redbg: #7f1d1d;
  --yellow: #f59e0b; --purple: #9333ea;
  --radius: 12px; --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
button { cursor: pointer; border: none; font-family: inherit; }
input, select, textarea { font-family: inherit; }
.container { max-width: 700px; margin: 0 auto; padding: 0 16px 100px; }

/* Header */
.header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid var(--bg3); padding: 12px 16px; position: sticky; top: 0; z-index: 40; }
.header-inner { max-width: 700px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 1.1rem; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
.header h1 span { font-size: 1.2rem; }
.header .ver { color: var(--text3); font-size: 0.8rem; }
.auth-btn { padding: 6px 14px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 600; color: #fff; }

/* Nav */
.nav { background: var(--bg2); border-bottom: 1px solid var(--bg3); padding: 4px 8px; position: sticky; top: 49px; z-index: 39; }
.nav-inner { max-width: 700px; margin: 0 auto; display: flex; }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: var(--radius-sm); background: transparent; color: var(--text3); font-size: 0.7rem; transition: all 0.2s; }
.nav button.active { background: var(--bg3); color: var(--blue2); }
.nav button svg { width: 18px; height: 18px; margin-bottom: 2px; }

/* Cards */
.card { background: var(--bg2); border: 1px solid #2d3748; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card-title { font-weight: 600; color: #f1f5f9; margin-bottom: 12px; font-size: 0.95rem; }

/* Inputs */
.input { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 2px solid #374151; background: #0a0d14; color: var(--text); font-size: 0.9rem; }
.input:focus { outline: none; border-color: var(--blue); background: #0f1320; }
.input-sm { padding: 8px 10px; font-size: 0.85rem; }
.label { color: #93c5fd; font-size: 0.75rem; margin-bottom: 4px; display: block; font-weight: 500; }

/* Buttons */
.btn { padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; width: 100%; transition: all 0.2s; }
.btn-green { background: var(--green); color: #fff; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-red { background: var(--redbg); color: #fca5a5; }
.btn-purple { background: var(--purple); color: #fff; }
.btn:disabled { background: #374151; color: #666; cursor: not-allowed; }
.btn-sm { padding: 8px 16px; font-size: 0.8rem; }

/* Grid */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
.flex { display: flex; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; }

/* Route items */
.route-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: var(--radius-sm); background: #0a0d14; margin-bottom: 6px; cursor: pointer; transition: all 0.15s; border: 1px solid #2d3748; }
.route-item:hover { border-color: var(--blue); background: #0f1a2e; }
.route-item.selected { border-color: var(--blue); background: #0f1a2e; border-width: 2px; }

/* Trip cards */
.trip-card { border-radius: var(--radius); overflow: hidden; background: var(--bg2); border: 1px solid var(--bg3); margin-bottom: 8px; }
.trip-card.all-reported { border-color: var(--green); }
.trip-header { width: 100%; padding: 14px; text-align: left; display: flex; align-items: center; justify-content: space-between; background: transparent; color: var(--text); }
.trip-detail { padding: 0 14px 14px; border-top: 1px solid var(--bg3); }

/* Summary boxes */
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.summary-box { background: #f0f4ff; border: 1px solid #d0d8f0; border-radius: 6px; padding: 10px; text-align: center; }
.summary-box .val { font-size: 20px; font-weight: bold; color: #1e3a5f; }
.summary-box .lbl { font-size: 10px; color: #666; }

/* Badge */
.badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.badge-green { background: var(--green); color: #fff; }
.badge-yellow { background: #92400e; color: #fbbf24; }

/* Filter buttons */
.filter-btn { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 0.8rem; border: 2px solid #374151; background: #0a0d14; color: var(--text2); font-weight: 500; }
.filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

/* Loading */
.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--text3); }
.spinner { width: 24px; height: 24px; border: 3px solid var(--bg3); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Message */
.msg { padding: 8px 12px; border-radius: var(--radius-sm); text-align: center; font-size: 0.85rem; margin: 8px 0; }
.msg-success { background: var(--greenbg); color: #34d399; }
.msg-error { background: var(--redbg); color: #fca5a5; }

/* Scrollable */
.scroll-list { max-height: 400px; overflow-y: auto; }

/* Report overlay */
.report-overlay { position: fixed; inset: 0; z-index: 50; background: #fff; color: #1a1a1a; overflow-y: auto; }
.report-toolbar { position: sticky; top: 0; z-index: 51; display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #1e293b; color: #fff; }
.report-content { padding: 20px; max-width: 900px; margin: 0 auto; font-size: 12px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--bg3); border: 1px solid #374151; border-radius: var(--radius); padding: 24px; margin: 16px; max-width: 380px; width: 100%; }

/* Print */
@media print { .no-print { display: none !important; } }
</style>
</head>
<body>

<div id="app"></div>

<!-- Google API -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  API_KEY: 'AIzaSyBIsuZBfbHY3Egj6TXgRWjnEuUL_xfmZzQ',
  CLIENT_ID: '63213815271-0bie77eiqfs3j6na8m1iq3ek1hug66p9.apps.googleusercontent.com',
  SHEET_ID: '1XBDnloUNP6PNmAxyxcytCYoQYv2rGXGpxct6H5tjHa8',
  SCOPES: 'https://www.googleapis.com/auth/spreadsheets',
  ROUTES_SHEET: 'Rutedata Reklameomdeling',
  TRIPS_SHEET: 'Kørsler',
  VERSION: '5.6',
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const state = {
  view: 'new', // new, history, stats, data
  routes: [],
  trips: [],
  selectedRoutes: [],
  tripDate: new Date().toISOString().split('T')[0],
  kmFromHome: '', kmToHome: '',
  kmBetween: {}, comments: {},
  driveTimes: {}, // { 'fromHome': 12, 'routeId': 8, 'toHome': 15 } in minutes
  routeSearch: '',
  expandedTrip: null,
  acubizFilter: 'all',
  statsPeriod: 'ytd', statsFrom: '', statsTo: '',
  showReport: false, showSkatExport: false,
  deleteConfirm: null,
  editRouteId: null,
  calcDistances: false,
  showAddRoute: false,
  adHocMode: false,
  adHoc: { desc:'', by:'', startAddr:'', slutAddr:'', antal:'', km:'', tid:'', fraHjem:'', tilHjem:'', kommentar:'' },
  newRoute: { postnr:'', rutenr:'', by:'', startAdresse:'', slutAdresse:'', husstande:'', km:'', tid:'', htfaKm:'', sathKm:'', isDepot: false },
  msg: null,
  loading: false,
  authed: false,
  tokenClient: null,
  accessToken: null,
};

// ═══════════════════════════════════════════════════════════
// GOOGLE SHEETS API
// ═══════════════════════════════════════════════════════════
async function sheetsGet(range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${encodeURIComponent(range)}?key=${CONFIG.API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sheets GET error: ${res.status}`);
  return (await res.json()).values || [];
}

async function sheetsUpdate(range, values) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${state.accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ range, values }),
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j.error?.message || ''; } catch {}
    throw new Error(`Sheets PUT error ${res.status}${detail ? ': ' + detail : ''}`);
  }
  return res.json();
}

async function sheetsAppend(range, values) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${state.accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ range, values }),
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j.error?.message || ''; } catch {}
    throw new Error(`Sheets APPEND error ${res.status}${detail ? ': ' + detail : ''}`);
  }
  return res.json();
}

async function ensureTripsSheet() {
  // Check if Kørsler sheet exists, create if not
  try {
    await sheetsGet(`${CONFIG.TRIPS_SHEET}!A1`);
  } catch (e) {
    // Sheet doesn't exist, create it
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}:batchUpdate`;
    await fetch(url, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requests: [{ addSheet: { properties: { title: CONFIG.TRIPS_SHEET } } }]
      }),
    });
    // Add headers
    await sheetsUpdate(`${CONFIG.TRIPS_SHEET}!A1:O1`, [[
      'ID', 'Dato', 'Ruter_JSON', 'KmFraHjem', 'KmTilHjem', 'KmMellem_JSON',
      'Kommentarer_JSON', 'AcubizRuter_JSON', 'TotalRouteKm', 'TotalTransportKm',
      'TotalHusstande', 'TotalTidMin', 'Oprettet', 'Opdateret'
    ]]);
  }
}

// ═══════════════════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════════════════
async function loadRoutes() {
  try {
    let rows;
    let sheetName = CONFIG.ROUTES_SHEET;
    try {
      rows = await sheetsGet(`${sheetName}!A1:Z`);
    } catch (e) {
      // Try fetching sheet names and use the first one
      const metaUrl = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}?key=${CONFIG.API_KEY}&fields=sheets.properties.title`;
      const metaRes = await fetch(metaUrl);
      const meta = await metaRes.json();
      if (meta.sheets && meta.sheets.length > 0) {
        const firstName = meta.sheets[0].properties.title;
        showMsg(`Prøver ark: "${firstName}"`, 'success');
        sheetName = firstName;
        rows = await sheetsGet(`${firstName}!A1:Z`);
      } else {
        throw new Error('Ingen ark fundet');
      }
    }
    if (!rows || rows.length < 2) { showMsg('Ingen rutedata fundet', 'error'); return; }

    state.routeSheetName = sheetName;
    state.routeSheetHeaders = rows[0];

    const headers = rows[0].map(h => h.toLowerCase().replace(/[\s.()]/g, ''));
    const colIdx = {};
    headers.forEach((h, i) => {
      colIdx[h] = i;
      // Handle aliases
      if (h === 'postnummer') colIdx['postnr'] = i;
      if (h === 'rutenr') colIdx['rutenr'] = i;
    });
    state.routeColIdx = colIdx;

    state.routes = rows.slice(1).map((row, i) => ({ row, sheetRow: i + 2 })).filter(x => x.row.length > 1 && x.row[colIdx['postnr']]).map(({row, sheetRow}) => {
      const get = (key) => row[colIdx[key]] || '';
      const postnr = (get('postnr') || get('postnummer')).toString().trim();
      const rutenr = get('rutenr').toString().trim();
      const by = get('byellerland') || get('by') || '';
      const isDepot = by.toLowerCase() === 'depot' || rutenr.toLowerCase().includes('depot');
      const meters = parseFloat((get('rutelængdemeter') || '0').replace(',', '.')) || 0;
      const km = meters > 0 ? meters / 1000 : (parseFloat((get('km') || '0').replace(',', '.')) || 0);
      const tidStr = get('omdelingstidmin') || get('tid') || '';
      const tidMin = parseInt(tidStr) || 0;
      const tid = tidMin > 0 ? `${Math.floor(tidMin/60)}:${String(tidMin%60).padStart(2,'0')}` : '';
      const htfaKm = parseFloat((get('htfakm') || '0').replace(',', '.')) || 0;
      const sathKm = parseFloat((get('sathkm') || '0').replace(',', '.')) || 0;

      return {
        id: `${postnr}-${rutenr}`,
        sheetRow,
        postnr, rutenr, by,
        startAdresse: get('startadresse'),
        slutAdresse: get('slutadresse'),
        husstande: parseInt(get('antalhusstande') || get('husstande') || '0') || 0,
        aviser: parseInt(get('antalaviser') || '0') || 0,
        km, tid, tidMin, htfaKm, sathKm,
        type: isDepot ? 'depot' : 'rute',
      };
    }).sort((a, b) => a.id.localeCompare(b.id));

    showMsg(`✅ ${state.routes.length} ruter indlæst`, 'success');
  } catch (e) {
    console.error('Route load error:', e);
    showMsg('❌ Kunne ikke indlæse ruter: ' + e.message + ' — Tjek at sheetet er delt (mindst "Anyone with link can view")', 'error');
  }
}

async function loadTrips() {
  try {
    const rows = await sheetsGet(`${CONFIG.TRIPS_SHEET}!A2:O`);
    state.trips = rows.filter(r => r.length > 1).map(row => {
      const parseJ = (s) => { try { return JSON.parse(s || '{}'); } catch { return {}; } };
      const parseA = (s) => { try { return JSON.parse(s || '[]'); } catch { return []; } };
      return {
        id: row[0] || Date.now().toString(),
        date: row[1] || '',
        routes: parseA(row[2]),
        kmFromHome: parseFloat(row[3]) || 0,
        kmToHome: parseFloat(row[4]) || 0,
        kmBetween: parseJ(row[5]),
        comments: parseJ(row[6]),
        acubizRoutes: parseJ(row[7]),
        totalRouteKm: parseFloat(row[8]) || 0,
        totalTransportKm: parseFloat(row[9]) || 0,
        totalHusstande: parseInt(row[10]) || 0,
        totalTidMin: parseInt(row[11]) || 0,
        driveTimes: parseJ(row[14]),
      };
    }).sort((a, b) => b.date.localeCompare(a.date));
  } catch (e) {
    // Trips sheet may not exist yet
    state.trips = [];
  }
}

function tripToRow(t) {
  return [
    t.id, t.date, JSON.stringify(t.routes),
    t.kmFromHome, t.kmToHome,
    JSON.stringify(t.kmBetween), JSON.stringify(t.comments),
    JSON.stringify(t.acubizRoutes || {}),
    t.totalRouteKm, t.totalTransportKm, t.totalHusstande,
    t.routes.reduce((s, r) => s + (r.tidMin || 0), 0),
    t.createdAt || new Date().toISOString(),
    new Date().toISOString(),
    JSON.stringify(t.driveTimes || {}),
  ];
}

async function saveAllTrips() {
  if (!state.accessToken) { showMsg('⚠️ Log ind for at gemme', 'error'); return; }
  try {
    await ensureTripsSheet();
    if (state.trips.length === 0) {
      await sheetsUpdate(`${CONFIG.TRIPS_SHEET}!A2:O2`, [['', '', '', '', '', '', '', '', '', '', '', '', '', '', '']]);
    } else {
      const values = state.trips.map(tripToRow);
      await sheetsUpdate(`${CONFIG.TRIPS_SHEET}!A2:O${values.length + 1}`, values);
    }
  } catch (e) {
    showMsg('❌ Gemme-fejl: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════════
// ROUTES SHEET WRITE-BACK (manuelt oprettede/redigerede ruter)
// ═══════════════════════════════════════════════════════════
function colLetter(idx) {
  let s = '';
  idx = idx + 1;
  while (idx > 0) {
    const rem = (idx - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    idx = Math.floor((idx - 1) / 26);
  }
  return s;
}

function firstColIdx(keys) {
  if (!state.routeColIdx) return -1;
  for (const k of keys) {
    if (state.routeColIdx[k] !== undefined) return state.routeColIdx[k];
  }
  return -1;
}

// Bygger en fuld række (array) til Sheets ud fra en rute, matchet mod de faktiske kolonneoverskrifter
function buildRouteRow(route) {
  const headers = state.routeSheetHeaders || [];
  const rowArr = new Array(headers.length).fill('');

  const set = (keys, value) => {
    const idx = firstColIdx(keys);
    if (idx >= 0) rowArr[idx] = value;
  };

  set(['postnr', 'postnummer'], route.postnr);
  set(['rutenr'], route.rutenr);
  if (route.type === 'depot') set(['byellerland', 'by'], 'Depot');
  else if (route.by) set(['byellerland', 'by'], route.by);
  set(['startadresse'], route.startAdresse || '');
  set(['slutadresse'], route.slutAdresse || '');
  set(['antalhusstande', 'husstande'], route.husstande || 0);
  set(['antalaviser'], route.aviser || 0);
  // Km: skriv til meter-kolonne hvis den findes, ellers km-kolonne
  if (firstColIdx(['rutelængdemeter']) >= 0) {
    set(['rutelængdemeter'], Math.round((route.km || 0) * 1000));
  } else {
    set(['km'], route.km || 0);
  }
  set(['omdelingstidmin', 'tid'], route.tidMin || 0);
  set(['htfakm'], route.htfaKm || 0);
  set(['sathkm'], route.sathKm || 0);

  return rowArr;
}

async function appendRouteToSheet(route) {
  if (!state.authed) { showMsg('⚠️ Log ind for at gemme ruten i Google Sheet', 'error'); return false; }
  if (!state.routeSheetHeaders) { showMsg('⚠️ Kunne ikke finde arkets kolonner — genindlæs ruter først', 'error'); return false; }
  try {
    const row = buildRouteRow(route);
    await sheetsAppend(`${state.routeSheetName || CONFIG.ROUTES_SHEET}!A1`, [row]);
    await loadRoutes(); // genindlæs så sheetRow-numre bliver korrekte
    return true;
  } catch (e) {
    showMsg('❌ Kunne ikke gemme ruten i Sheet: ' + e.message, 'error');
    return false;
  }
}

async function updateRouteFieldInSheet(route, field) {
  if (!state.authed) { showMsg('⚠️ Log ind for at gemme ændringen i Google Sheet', 'error'); return; }
  if (!route.sheetRow) { showMsg('⚠️ Ruten findes ikke i Sheetet endnu', 'error'); return; }

  const fieldMap = {
    husstande: () => { const idx = firstColIdx(['antalhusstande','husstande']); return idx >= 0 ? { idx, val: route.husstande || 0 } : null; },
    km: () => {
      const meterIdx = firstColIdx(['rutelængdemeter']);
      if (meterIdx >= 0) return { idx: meterIdx, val: Math.round((route.km || 0) * 1000) };
      const kmIdx = firstColIdx(['km']);
      return kmIdx >= 0 ? { idx: kmIdx, val: route.km || 0 } : null;
    },
    htfaKm: () => { const idx = firstColIdx(['htfakm']); return idx >= 0 ? { idx, val: route.htfaKm || 0 } : null; },
    sathKm: () => { const idx = firstColIdx(['sathkm']); return idx >= 0 ? { idx, val: route.sathKm || 0 } : null; },
  };

  const resolver = fieldMap[field];
  const target = resolver ? resolver() : null;
  if (!target) { showMsg('⚠️ Denne kolonne findes ikke i Sheetet', 'error'); return; }

  try {
    const col = colLetter(target.idx);
    await sheetsUpdate(`${state.routeSheetName || CONFIG.ROUTES_SHEET}!${col}${route.sheetRow}`, [[target.val]]);
    showMsg('✅ Gemt i Google Sheet', 'success');
  } catch (e) {
    showMsg('❌ Kunne ikke opdatere Sheet: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
function initAuth() {
  if (typeof google === 'undefined') {
    setTimeout(initAuth, 500);
    return;
  }
  
  // Check for saved token
  const savedToken = sessionStorage.getItem('rt_access_token');
  const savedExpiry = sessionStorage.getItem('rt_token_expiry');
  if (savedToken && savedExpiry && Date.now() < parseInt(savedExpiry)) {
    state.accessToken = savedToken;
    state.authed = true;
  }
  
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPES,
    callback: async (resp) => {
      if (resp.error) {
        showMsg('❌ Login fejlede', 'error');
        return;
      }
      state.accessToken = resp.access_token;
      state.authed = true;
      // Save token with expiry (default ~1 hour)
      sessionStorage.setItem('rt_access_token', resp.access_token);
      sessionStorage.setItem('rt_token_expiry', String(Date.now() + (resp.expires_in || 3600) * 1000));
      showMsg('✅ Logget ind!', 'success');
      await ensureTripsSheet();
      await loadTrips();
      render();
    },
  });
  
  // If we restored a token, load trips
  if (state.authed) {
    ensureTripsSheet().then(() => loadTrips()).then(() => render());
  }
}

function doLogin() {
  if (state.tokenClient) {
    state.tokenClient.requestAccessToken({ prompt: 'consent' });
  }
}

// HELPERS
// ═══════════════════════════════════════════════════════════
function fmtNum(v) { return (v || 0).toFixed(1).replace('.', ','); }
function fmtDate(d) {
  try {
    const dt = new Date(d + 'T00:00:00');
    const days = ['Søn','Man','Tir','Ons','Tor','Fre','Lør'];
    const months = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
    return `${days[dt.getDay()]} ${dt.getDate()}. ${months[dt.getMonth()]}`;
  } catch { return d; }
}
function showMsg(text, type='success') {
  state.msg = { text, type };
  render();
  if (type !== 'error') {
    setTimeout(() => { if (state.msg && state.msg.text === text) { state.msg = null; render(); } }, 4000);
  }
}

function getFilteredTrips() {
  const now = new Date();
  const y = now.getFullYear();
  return state.trips.filter(t => {
    const d = t.date;
    if (state.statsPeriod === 'ytd') return d >= `${y}-01-01`;
    if (state.statsPeriod === 'lastYear') return d >= `${y-1}-01-01` && d <= `${y-1}-12-31`;
    if (state.statsPeriod === 'thisMonth') { const m = String(now.getMonth()+1).padStart(2,'0'); return d >= `${y}-${m}-01`; }
    if (state.statsPeriod === 'lastMonth') { const lm = new Date(y, now.getMonth()-1, 1); const m = String(lm.getMonth()+1).padStart(2,'0'); const ly = lm.getFullYear(); return d >= `${ly}-${m}-01` && d < `${y}-${String(now.getMonth()+1).padStart(2,'0')}-01`; }
    if (state.statsPeriod === 'custom') return (!state.statsFrom || d >= state.statsFrom) && (!state.statsTo || d <= state.statsTo);
    return true;
  });
}

function findRoute(tripRoute) {
  const routeMap = {};
  state.routes.forEach(r => routeMap[r.id] = r);
  if (routeMap[tripRoute.id]) return routeMap[tripRoute.id];
  return state.routes.find(r =>
    r.postnr === tripRoute.postnr && (
      r.rutenr.startsWith(tripRoute.rutenr) ||
      tripRoute.rutenr.startsWith(r.rutenr) ||
      r.rutenr.toLowerCase().includes(tripRoute.rutenr.toLowerCase()) ||
      tripRoute.rutenr.toLowerCase().includes(r.rutenr.toLowerCase())
    )
  ) || null;
}

function renderHistory() {

    </div>`;
  }
  
  const filteredTrips = state.trips.filter(t => {
    const allDone = t.routes.length > 0 && t.routes.every(r => t.acubizRoutes?.[r.id]);
    if (state.acubizFilter === 'all') return true;
    if (state.acubizFilter === 'done') return allDone;
    return !allDone;
  });
  
  const pendingCount = state.trips.filter(t => !t.routes.every(r => t.acubizRoutes?.[r.id])).length;
  
  return `
    <div class="flex gap-2" style="margin-bottom:12px">
      ${['all','pending','done'].map(f => {
        const labels = { all: 'Alle', pending: '☐ Mangler', done: '✅ Indberettet' };
        return `<button class="filter-btn ${state.acubizFilter===f?'active':''}" onclick="state.acubizFilter='${f}';render()">

// ─── REPORT ────────────────────────────────────────────
function getWeekNumber(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const week1 = new Date(d.getFullYear(), 0, 4);
  return Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7) + 1;
}

function calcSubtotals(trips) {
  return trips.reduce((a,t) => ({
    trips: a.trips+1, routes: a.routes+t.routes.length, husstande: a.husstande+t.totalHusstande,
    routeKm: a.routeKm+t.totalRouteKm, transportKm: a.transportKm+t.totalTransportKm,
    fromHome: a.fromHome+t.kmFromHome, toHome: a.toHome+t.kmToHome,
    between: a.between+Object.values(t.kmBetween||{}).reduce((s,v)=>s+v,0),
    tidMin: a.tidMin+t.routes.reduce((s,r)=>s+(r.tidMin||0),0),
    driveMin: a.driveMin+Object.entries(t.driveTimes||{}).filter(([k])=>k!=='fromHome'&&k!=='toHome').reduce((s,[,v])=>s+(v||0),0),
  }), {trips:0,routes:0,husstande:0,routeKm:0,transportKm:0,fromHome:0,toHome:0,between:0,tidMin:0,driveMin:0});
}

function fmtTid(min) { return min > 0 ? `${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}` : '-'; }

function renderSubtotalRow(label, sub, bgColor) {
  return `<tr style="font-weight:bold;background:${bgColor};border-top:2px solid #2563eb">
    <td style="padding:5px 6px" colspan="2">${label}</td>
    <td style="padding:5px 6px">${sub.trips} kørsler</td>
    <td style="padding:5px 6px;text-align:right">${sub.husstande}</td>
    <td style="padding:5px 6px;text-align:right">${fmtNum(sub.routeKm)}</td>
    <td style="padding:5px 6px;text-align:right">${fmtNum(sub.fromHome)}</td>
    <td style="padding:5px 6px;text-align:right">${fmtNum(sub.between)}</td>
    <td style="padding:5px 6px;text-align:right">${fmtNum(sub.toHome)}</td>
    <td style="padding:5px 6px;text-align:right">${fmtNum(sub.transportKm)}</td>
    <td style="padding:5px 6px;text-align:right">${fmtTid(sub.tidMin)}</td>
    <td style="padding:5px 6px;text-align:right;color:#3b82f6">${sub.driveMin > 0 ? fmtTid(sub.driveMin) : '-'}</td>
  </tr>`;
}

function renderReport() {
  const filtered = getFilteredTrips().sort((a,b) => a.date.localeCompare(b.date));
  const totals = calcSubtotals(filtered);
  const periodLabel = {ytd:`År til dato ${new Date().getFullYear()}`,lastYear:`${new Date().getFullYear()-1}`,thisMonth:'Denne måned',lastMonth:'Sidste måned',custom:`${state.statsFrom} til ${state.statsTo}`}[state.statsPeriod]||'';
  const tidStr = fmtTid(totals.tidMin);
  const driveStr = fmtTid(totals.driveMin);
  
  const dkMonths = {'01':'Januar','02':'Februar','03':'Marts','04':'April','05':'Maj','06':'Juni','07':'Juli','08':'August','09':'September','10':'Oktober','11':'November','12':'December'};

  // Group trips: weeks split per month boundary, week header at top of each group
  let tableRows = '';
  let currentMonth = '';
  let currentWeek = '';
  let monthTrips = [];
  let weekTrips = [];
  let rowIdx = 0;

  for (let i = 0; i < filtered.length; i++) {
    const t = filtered[i];
    const month = t.date.substring(0, 7);
    const week = `${t.date.substring(0,4)}-W${String(getWeekNumber(t.date)).padStart(2,'0')}`;
    const weekNum = String(getWeekNumber(t.date)).padStart(2,'0');
    const tMin = t.routes.reduce((s,r) => s+(r.tidMin||0), 0);

    const monthChanged = month !== currentMonth;
    const weekChanged = week !== currentWeek;

    // Close previous week subtotal if week or month changes
    if ((weekChanged || monthChanged) && weekTrips.length > 0) {
      const ws = calcSubtotals(weekTrips);
      tableRows += renderSubtotalRow(`Uge ${currentWeek.split('-W')[1]} i alt`, ws, '#e8f0fe');
      weekTrips = [];
    }

    // Close previous month subtotal if month changes
    if (monthChanged && monthTrips.length > 0) {
      const ms = calcSubtotals(monthTrips);
      const mParts = currentMonth.split('-');
      tableRows += renderSubtotalRow(`📅 ${dkMonths[mParts[1]] || mParts[1]} ${mParts[0]} i alt`, ms, '#dbeafe');
      monthTrips = [];
    }

    // New month header
    if (monthChanged) {
      currentMonth = month;
      const mParts = month.split('-');
      tableRows += `<tr><td colspan="12" style="padding:10px 6px 4px;font-weight:bold;font-size:14px;color:#1e3a5f;background:#fff;border-bottom:2px solid #2563eb">
        ${dkMonths[mParts[1]] || mParts[1]} ${mParts[0]}
      </td></tr>`;
    }

    // New week header
    if (weekChanged || monthChanged) {
      currentWeek = week;
      tableRows += `<tr style="background:#f8faff"><td colspan="12" style="padding:5px 6px;font-size:11px;font-weight:600;color:#3b82f6;border-bottom:1px solid #dbeafe">
        📅 Uge ${weekNum}
      </td></tr>`;
    }

    monthTrips.push(t);
    weekTrips.push(t);

    // Trip row
    const driveMin = Object.entries(t.driveTimes||{}).filter(([k])=>k!=='fromHome'&&k!=='toHome').reduce((s,[,v])=>s+(v||0),0);
    tableRows += `<tr style="background:${rowIdx%2?'#f8f9fa':'#fff'}">
      <td style="padding:5px 6px;white-space:nowrap">${fmtDate(t.date)}</td>
      <td style="padding:5px 6px;text-align:right">${t.routes.length}</td>
      <td style="padding:5px 6px;font-size:10px">${t.routes.map(r=>r.postnr+'-'+r.rutenr).join(', ')}</td>
      <td style="padding:5px 6px;text-align:right">${t.totalHusstande}</td>
      <td style="padding:5px 6px;text-align:right">${fmtNum(t.totalRouteKm)}</td>
      <td style="padding:5px 6px;text-align:right">${fmtNum(t.kmFromHome)}</td>
      <td style="padding:5px 6px;text-align:right">${fmtNum(Object.values(t.kmBetween||{}).reduce((s,v)=>s+v,0))}</td>
      <td style="padding:5px 6px;text-align:right">${fmtNum(t.kmToHome)}</td>
      <td style="padding:5px 6px;text-align:right;font-weight:bold">${fmtNum(t.totalTransportKm)}</td>
      <td style="padding:5px 6px;text-align:right">${fmtTid(tMin)}</td>
      <td style="padding:5px 6px;text-align:right;color:#2563eb">${driveMin > 0 ? fmtTid(driveMin) : '-'}</td>
    </tr>`;
    rowIdx++;
  }

  // Close last week and month
  if (weekTrips.length > 0) {
    const ws = calcSubtotals(weekTrips);
    tableRows += renderSubtotalRow(`Uge ${currentWeek.split('-W')[1]} i alt`, ws, '#e8f0fe');
  }
  if (monthTrips.length > 0) {
    const ms = calcSubtotals(monthTrips);
    const mParts = currentMonth.split('-');
    tableRows += renderSubtotalRow(`📅 ${dkMonths[mParts[1]] || mParts[1]} ${mParts[0]}`, ms, '#dbeafe');
  }

  // Grand total
  tableRows += renderSubtotalRow(`🏁 TOTAL PERIODE`, totals, '#e8f0fe');

  return `<div class="report-overlay">
    <div class="report-toolbar no-print">
      <span style="font-weight:700;font-size:0.9rem">📄 ${periodLabel}</span>
      <button onclick="state.showReport=false;render()" style="background:var(--red);color:#fff;padding:6px 16px;border-radius:6px;font-weight:700">✕ Luk</button>
    </div>
    <div class="report-content">
      <h1 style="font-size:20px;margin-bottom:4px">Kørselsregnskab</h1>
      <p style="color:#666;font-size:13px">${periodLabel}</p>
      <p style="color:#999;font-size:11px;margin-bottom:16px">Udskrevet: ${new Date().toLocaleDateString('da-DK')} — Rutetracker</p>
      <div class="summary-grid">
        ${[{v:totals.trips,l:'Kørsler'},{v:totals.routes,l:'Ruter kørt'},{v:totals.husstande,l:'Husstande'},
          {v:fmtNum(totals.routeKm),l:'Rute-km'},{v:fmtNum(totals.transportKm),l:'Transport-km'},{v:fmtNum(totals.routeKm+totals.transportKm),l:'Total km'},
          ...(tidStr&&tidStr!=='-'?[{v:tidStr,l:'Omdelingstid'}]:[]),
          ...(driveStr&&driveStr!=='-'?[{v:driveStr,l:'Køretid ml. ruter'}]:[]),        ].map(c=>`<div class="summary-box"><div class="val">${c.v}</div><div class="lbl">${c.l}</div></div>`).join('')}
      </div>
      <h2 style="font-size:15px;border-bottom:2px solid #2563eb;padding-bottom:4px;margin-bottom:10px">Oversigt pr. uge og måned</h2>
      <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:24px">
        <thead><tr style="background:#1e293b;color:#fff">
          ${['Dato','Ant.','Rutenumre','Hus.','Rute-km','Fra hjem','Mellem','Til hjem','Transport','Omdelingstid','Rute→Rute'].map(h=>`<th style="padding:6px;text-align:${['Dato','Rutenumre'].includes(h)?'left':'right'};font-size:10px">${h}</th>`).join('')}
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  </div>`;
}

function addAdHocRoute() {
  const ah = state.adHoc;
  if (!ah.desc) { showMsg('Indtast en beskrivelse', 'error'); return; }
  const km = parseFloat((ah.km || '0').replace(',', '.')) || 0;
  const tidMin = parseInt(ah.tid || '0') || 0;
  const id = `adhoc-${Date.now()}`;
  const route = {
    id,
    postnr: 'Ad hoc',
    rutenr: ah.desc,
    by: ah.by || '',
    startAdresse: ah.startAddr || '',
    slutAdresse: ah.slutAddr || '',
    husstande: parseInt(ah.antal || '0') || 0,
    km,
    tid: tidMin > 0 ? `${Math.floor(tidMin/60)}:${String(tidMin%60).padStart(2,'0')}` : '',
    tidMin,
    htfaKm: parseFloat((ah.fraHjem || '0').replace(',', '.')) || 0,
    sathKm: parseFloat((ah.tilHjem || '0').replace(',', '.')) || 0,
    type: 'adhoc',
    aviser: 0,
  };
  state.selectedRoutes.push(route);
  if (ah.kommentar) state.comments[id] = ah.kommentar;

  state.adHoc = { desc:'', by:'', startAddr:'', slutAddr:'', antal:'', km:'', tid:'', fraHjem:'', tilHjem:'', kommentar:'' };
  recalcAllDistances();
}

// ═══════════════════════════════════════════════════════════
// GOOGLE ROUTES API - auto-calculate distances
// ═══════════════════════════════════════════════════════════
const homeAddress = 'Rosenvænget 2A, 4640 Faxe, Denmark';
let distanceCache = {};

// Load cache from sessionStorage
try { distanceCache = JSON.parse(sessionStorage.getItem('rt_dist_cache') || '{}'); } catch {}

function saveDistanceCache() {
  try { sessionStorage.setItem('rt_dist_cache', JSON.stringify(distanceCache)); } catch {}
}

function cacheKey(from, to) {
  return `${from}|||${to}`;
}

async function getRouteDistance(fromAddr, toAddr) {
  if (!fromAddr || !toAddr) return null;
  const key = cacheKey(fromAddr, toAddr);
  if (distanceCache[key] !== undefined) return distanceCache[key];

  try {
    const url = `https://routes.googleapis.com/directions/v2:computeRoutes`;
    const body = {
      origin: { address: fromAddr },
      destination: { address: toAddr },
      travelMode: 'DRIVE',
      routingPreference: 'TRAFFIC_UNAWARE',
    };
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': CONFIG.API_KEY,
        'X-Goog-FieldMask': 'routes.distanceMeters,routes.duration',
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      console.error('Routes API error:', res.status, JSON.stringify(data));
      showMsg('⚠️ Routes API fejl: ' + (data.error?.message || res.status), 'error');
      return null;
    }
    if (data.routes && data.routes.length > 0) {
      const km = Math.round(data.routes[0].distanceMeters / 100) / 10;
      const durStr = String(data.routes[0].duration || '0s').replace('s', '');
      const durMin = Math.round(parseInt(durStr) / 60) || 0;
      const result = { km, durMin };
      distanceCache[key] = result;
      saveDistanceCache();
      return result;
    }
  } catch (e) {
    console.error('Routes API fetch error:', e);
    showMsg('⚠️ Netværksfejl ved km-beregning', 'error');
  }
  return null;
}

function getEndAddress(route) {
  return route.slutAdresse || route.startAdresse || '';
}

function getStartAddress(route) {
  return route.startAdresse || route.slutAdresse || '';
}

async function recalcAllDistances() {
  if (state.selectedRoutes.length === 0) return;
  state.calcDistances = true;
  state.driveTimes = {};
  render();

  const routes = state.selectedRoutes;

  // Km from home to first route's start
  const firstStart = getStartAddress(routes[0]);
  if (firstStart) {
    const d = await getRouteDistance(homeAddress, firstStart);
    if (d) {
      state.kmFromHome = String(d.km).replace('.', ',');
      state.driveTimes['fromHome'] = d.durMin;
    }
  }

  // Km between consecutive routes
  for (let i = 1; i < routes.length; i++) {
    const prevEnd = getEndAddress(routes[i - 1]);
    const currStart = getStartAddress(routes[i]);
    if (prevEnd && currStart) {
      const d = await getRouteDistance(prevEnd, currStart);
      if (d) {
        state.kmBetween[routes[i].id] = String(d.km).replace('.', ',');
        state.driveTimes[routes[i].id] = d.durMin;
      }
    }
  }

  // Km from last route's end to home
  const lastEnd = getEndAddress(routes[routes.length - 1]);
  if (lastEnd) {
    const d = await getRouteDistance(lastEnd, homeAddress);
    if (d) {
      state.kmToHome = String(d.km).replace('.', ',');
      state.driveTimes['toHome'] = d.durMin;
    }
  }

  state.calcDistances = false;
  render();
  setTimeout(() => {
    const input = document.getElementById('routeSearchInput');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }, 50);
}

function addRoute(id) {
  const r = state.routes.find(x => x.id === id);
  if (!r || state.selectedRoutes.find(x => x.id === id)) return;
  state.selectedRoutes.push({...r});
  
  // Auto-calculate distances via API
  recalcAllDistances();
}

function removeRoute(idx) {
  state.selectedRoutes.splice(idx, 1);
  if (state.selectedRoutes.length > 0) {
    recalcAllDistances();
  } else {
    state.kmFromHome = '';
    state.kmToHome = '';
    state.kmBetween = {};
    render();
  }
}

function moveRoute(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= state.selectedRoutes.length) return;
  [state.selectedRoutes[idx], state.selectedRoutes[newIdx]] = [state.selectedRoutes[newIdx], state.selectedRoutes[idx]];
  recalcAllDistances();
}

async function saveTrip() {
  if (state.selectedRoutes.length === 0) return;
  if (!state.authed) { showMsg('⚠️ Log ind først for at gemme', 'error'); return; }
  
  const fromHome = parseFloat((state.kmFromHome||'0').replace(',','.'))||0;
  const toHome = parseFloat((state.kmToHome||'0').replace(',','.'))||0;
  let totalBetween = 0;
  const betweenDetails = {};
  state.selectedRoutes.forEach((r, i) => {
    if (i > 0) {
      const val = parseFloat((state.kmBetween[r.id]||'0').replace(',','.'))||0;
      betweenDetails[r.id] = val;
      totalBetween += val;
    }
  });
  const totalRouteKm = state.selectedRoutes.reduce((s,r) => s+(r.km||0), 0);
  const totalHusstande = state.selectedRoutes.reduce((s,r) => s+(r.husstande||0), 0);
  const totalTransportKm = fromHome + toHome + totalBetween;

  const existingIdx = state.trips.findIndex(t => t.date === state.tripDate);
  
  if (existingIdx >= 0) {
    const existing = state.trips[existingIdx];
    const existingIds = new Set(existing.routes.map(r => r.id));
    const newRoutes = state.selectedRoutes.filter(r => !existingIds.has(r.id));
    if (newRoutes.length === 0) { showMsg('Alle ruter findes allerede', 'error'); return; }
    
    const mergedRoutes = [...existing.routes, ...newRoutes.map(r => ({...r}))];
    const mergedBetween = {...existing.kmBetween, ...betweenDetails};
    const mergedComments = {...existing.comments, ...state.comments};
    const mergedDriveTimes = {...(existing.driveTimes||{}), ...state.driveTimes};
    state.trips[existingIdx] = {
      ...existing,
      routes: mergedRoutes,
      kmFromHome: Math.max(existing.kmFromHome, fromHome),
      kmToHome: Math.max(existing.kmToHome, toHome),
      kmBetween: mergedBetween, comments: mergedComments, driveTimes: mergedDriveTimes,
      totalRouteKm: mergedRoutes.reduce((s,r) => s+(r.km||0), 0),
      totalHusstande: mergedRoutes.reduce((s,r) => s+(r.husstande||0), 0),
      totalTransportKm: Math.max(existing.kmFromHome,fromHome) + Math.max(existing.kmToHome,toHome) + Object.values(mergedBetween).reduce((s,v)=>s+v,0),
    };
  } else {
    state.trips.push({
      id: Date.now().toString(),
      date: state.tripDate,
      routes: state.selectedRoutes.map(r => ({...r})),
      kmFromHome: fromHome, kmToHome: toHome,
      kmBetween: betweenDetails, comments: {...state.comments},
      acubizRoutes: {},
      driveTimes: {...state.driveTimes},
      totalRouteKm, totalTransportKm, totalHusstande,
    });
    state.trips.sort((a,b) => b.date.localeCompare(a.date));
  }
  
  state.selectedRoutes = [];
  state.kmFromHome = ''; state.kmToHome = '';
  state.kmBetween = {}; state.comments = {};
  state.driveTimes = {};
  state.routeSearch = '';
  
  await saveAllTrips();
  showMsg('✅ Kørsel gemt!', 'success');
  render();
}

function toggleAcubiz(tripId, routeId) {
  const trip = state.trips.find(t => t.id === tripId);
  if (!trip) return;
  if (!trip.acubizRoutes) trip.acubizRoutes = {};
  trip.acubizRoutes[routeId] = !trip.acubizRoutes[routeId];
  saveAllTrips();
  render();
}

function toggleAllAcubiz(tripId) {
  const trip = state.trips.find(t => t.id === tripId);
  if (!trip) return;
  const allDone = trip.routes.every(r => trip.acubizRoutes?.[r.id]);
  trip.acubizRoutes = {};
  trip.routes.forEach(r => { trip.acubizRoutes[r.id] = !allDone; });
  saveAllTrips();
  render();
}

function moveTripRoute(tripId, idx, dir) {
  const trip = state.trips.find(t => t.id === tripId);
  if (!trip) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= trip.routes.length) return;
  [trip.routes[idx], trip.routes[newIdx]] = [trip.routes[newIdx], trip.routes[idx]];
  saveAllTrips();
  render();
}

async function confirmDelete() {
  const dc = state.deleteConfirm;
  if (dc === 'all') {
    state.trips = [];
  } else if (dc?.startsWith('route:')) {
    const [, tripId, routeId] = dc.split(':');
    const trip = state.trips.find(t => t.id === tripId);
    if (trip) {
      trip.routes = trip.routes.filter(r => r.id !== routeId);
      if (trip.routes.length === 0) {
        state.trips = state.trips.filter(t => t.id !== tripId);
      } else {
        delete trip.kmBetween[routeId];
        delete trip.comments[routeId];
        if (trip.acubizRoutes) delete trip.acubizRoutes[routeId];
        trip.totalRouteKm = trip.routes.reduce((s,r) => s+(r.km||0), 0);
        trip.totalHusstande = trip.routes.reduce((s,r) => s+(r.husstande||0), 0);
        trip.totalTransportKm = trip.kmFromHome + trip.kmToHome + Object.values(trip.kmBetween).reduce((s,v)=>s+v,0);
      }
    }
  } else {
    state.trips = state.trips.filter(t => t.id !== dc);
  }
  state.deleteConfirm = null;
  await saveAllTrips();
  render();
}

async function recalcAll() {
  if (!state.authed) { showMsg('⚠️ Log ind først', 'error'); return; }
  
  const total = state.trips.length;
  let done = 0;
  showMsg(`⏳ Genberegner 0/${total} kørsler...`, 'success');

  for (const trip of state.trips) {
    // Only recalculate transport distances via Routes API - do NOT touch route master data
    // (husstande, km, tid, adresser stays as recorded on the original trip)

    // Calculate km from home to first route
    const firstStart = getStartAddress(trip.routes[0]);
    const newDriveTimes = {};
    if (firstStart) {
      const d = await getRouteDistance(homeAddress, firstStart);
      if (d) { trip.kmFromHome = d.km; newDriveTimes['fromHome'] = d.durMin; }
    }

    // Calculate km between routes
    const newBetween = {};
    for (let i = 1; i < trip.routes.length; i++) {
      const prevEnd = getEndAddress(trip.routes[i - 1]);
      const currStart = getStartAddress(trip.routes[i]);
      if (prevEnd && currStart) {
        const d = await getRouteDistance(prevEnd, currStart);
        if (d) { newBetween[trip.routes[i].id] = d.km; newDriveTimes[trip.routes[i].id] = d.durMin; }
        else newBetween[trip.routes[i].id] = trip.kmBetween?.[trip.routes[i].id] || 0;
      }
    }
    trip.kmBetween = newBetween;

    // Calculate km from last route to home
    const lastEnd = getEndAddress(trip.routes[trip.routes.length - 1]);
    if (lastEnd) {
      const d = await getRouteDistance(lastEnd, homeAddress);
      if (d) { trip.kmToHome = d.km; newDriveTimes['toHome'] = d.durMin; }
    }
    trip.driveTimes = newDriveTimes;

    // Recalc totals
    trip.totalRouteKm = trip.routes.reduce((s, r) => s + (r.km || 0), 0);
    trip.totalHusstande = trip.routes.reduce((s, r) => s + (r.husstande || 0), 0);
    trip.totalTransportKm = trip.kmFromHome + trip.kmToHome + Object.values(trip.kmBetween).reduce((s, v) => s + v, 0);

    done++;
    if (done % 3 === 0 || done === total) {
      showMsg(`⏳ Genberegner ${done}/${total} kørsler...`, 'success');
    }
  }

  await saveAllTrips();
  showMsg(`✅ ${total} kørsler genberegnet med km fra Routes API`, 'success');
  render();
}

function updateRoute(id, field, value) {
  const r = state.routes.find(x => x.id === id);
  if (r) { r[field] = value; }
  render();
  updateRouteFieldInSheet(r, field);
}

async function createRoute() {
  const nr = state.newRoute;
  if (!nr.postnr || !nr.rutenr) { showMsg('❌ Postnr og Rutenr er påkrævet', 'error'); return; }
  const id = `${nr.postnr}-${nr.rutenr}`;
  if (state.routes.find(r => r.id === id)) { showMsg(`❌ ${id} findes allerede`, 'error'); return; }
  const km = parseFloat((nr.km||'0').replace(',','.'))||0;
  const tidMin = parseInt(nr.tid||'0')||0;
  const newRoute = {
    id, postnr: nr.postnr, rutenr: nr.rutenr, by: '',
    startAdresse: nr.startAdresse || '', slutAdresse: nr.slutAdresse || '',
    husstande: parseInt(nr.husstande||'0')||0, km, tid: tidMin>0?`${Math.floor(tidMin/60)}:${String(tidMin%60).padStart(2,'0')}`:'', tidMin,
    htfaKm: parseFloat((nr.htfaKm||'0').replace(',','.'))||0,
    sathKm: parseFloat((nr.sathKm||'0').replace(',','.'))||0,
    type: nr.isDepot?'depot':'rute', aviser: 0,
  };

  state.loading = true;
  render();

  let ok = false;
  try {
    ok = await appendRouteToSheet(newRoute);
  } catch (e) {
    console.error('createRoute error:', e);
    showMsg('❌ Uventet fejl ved oprettelse: ' + e.message, 'error');
  }
  state.loading = false;

  if (!ok) {
    // Faldback: behold i lokal state selvom Sheet-skrivning fejlede, så data ikke går tabt
    state.routes.push(newRoute);
    state.routes.sort((a,b) => a.id.localeCompare(b.id));
  }

  state.newRoute = { postnr:'',rutenr:'',by:'',startAdresse:'',slutAdresse:'',husstande:'',km:'',tid:'',htfaKm:'',sathKm:'',isDepot:false };
  showMsg(ok ? `✅ ${id} oprettet og gemt i Google Sheet!` : `⚠️ ${id} oprettet lokalt, men kunne ikke gemmes i Sheet`, ok ? 'success' : 'error');
  render();
}

async function reloadData() {
  state.loading = true; render();
  await loadRoutes();
  if (state.authed) await loadTrips();
  state.loading = false; render();
}

async function importBackup() {
  const el = document.getElementById('importArea');
  if (!el || !el.value.trim()) { showMsg('Indsæt JSON-data først', 'error'); return; }
  if (!state.authed) { showMsg('⚠️ Log ind først', 'error'); return; }
  
  try {
    const data = JSON.parse(el.value.trim());
    const importTrips = data.trips || [];
    if (importTrips.length === 0) { showMsg('Ingen kørsler fundet i data', 'error'); return; }
    
    // Merge: add trips that don't exist yet (by date+id)
    const existingIds = new Set(state.trips.map(t => t.id));
    const existingDates = new Set(state.trips.map(t => t.date));
    let added = 0;
    
    for (const t of importTrips) {
      if (!existingIds.has(t.id) && !existingDates.has(t.date)) {
        if (!t.acubizRoutes) t.acubizRoutes = {};
        state.trips.push(t);
        added++;
      }
    }
    
    state.trips.sort((a, b) => b.date.localeCompare(a.date));
    await saveAllTrips();
    el.value = '';
    showMsg(`✅ ${added} kørsler importeret! (${importTrips.length - added} duplikater sprunget over)`, 'success');
    render();
  } catch (e) {
    showMsg('❌ Ugyldig JSON: ' + e.message, 'error');
  }
}

function generateSkatPDF() {
  const filtered = getFilteredTrips().sort((a,b) => a.date.localeCompare(b.date));
  if (filtered.length === 0) { showMsg('Ingen kørsler i valgt periode', 'error'); return; }

  const periodLabel = {
    ytd: `År til dato ${new Date().getFullYear()}`,
    lastYear: `${new Date().getFullYear()-1}`,
    thisMonth: 'Denne måned',
    lastMonth: 'Sidste måned',
    custom: `${state.statsFrom} til ${state.statsTo}`
  }[state.statsPeriod] || '';

  const dkMonths = {'01':'Januar','02':'Februar','03':'Marts','04':'April','05':'Maj','06':'Juni','07':'Juli','08':'August','09':'September','10':'Oktober','11':'November','12':'December'};
  const fmtN = v => (v||0).toFixed(1).replace('.',',');
  const fmtKr = v => (v||0).toFixed(2).replace('.',',') + ' kr';
  const fmtD = d => { try { const dt=new Date(d+'T00:00:00'); return `${dt.getDate()}/${dt.getMonth()+1}-${dt.getFullYear()}`; } catch { return d; } };

  // Skat 2026 rates
  const GRÆNSE = 24;       // første 24 km ingen fradrag
  const SAT1 = 2.23;       // kr/km for km 25-120
  const SAT2 = 1.12;       // kr/km for km over 120
  const GRÆNSE2 = 120;

  const calcFradrag = (totalKm) => {
    const fradragsKm = Math.max(0, totalKm - GRÆNSE);
    const sats1Km = Math.min(fradragsKm, GRÆNSE2 - GRÆNSE);
    const sats2Km = Math.max(0, fradragsKm - (GRÆNSE2 - GRÆNSE));
    const fradrag = sats1Km * SAT1 + sats2Km * SAT2;
    return { fradragsKm, fradrag };
  };

  // Build table rows grouped by month
  let rows = '';
  let currentMonth = '';
  let monthTrips = [];
  let grandTotal = { km: 0, transport: 0, husstande: 0, fradragsKm: 0, fradrag: 0 };

  const flushMonth = () => {
    if (!monthTrips.length) return;
    const mKm = monthTrips.reduce((s,t)=>s+t.totalRouteKm,0);
    const mTr = monthTrips.reduce((s,t)=>s+t.totalTransportKm,0);
    const mHus = monthTrips.reduce((s,t)=>s+t.totalHusstande,0);
    const mFr = monthTrips.reduce((s,t)=>s+calcFradrag(t.totalRouteKm+t.totalTransportKm).fradragsKm,0);
    const mFradrag = monthTrips.reduce((s,t)=>s+calcFradrag(t.totalRouteKm+t.totalTransportKm).fradrag,0);
    const mParts = currentMonth.split('-');
    rows += `<tr class="month-total">
      <td colspan="3"><strong>📅 ${dkMonths[mParts[1]]||mParts[1]} ${mParts[0]} — ${monthTrips.length} kørsler</strong></td>
      <td>${mHus}</td><td>${fmtN(mKm)}</td><td>${fmtN(mTr)}</td><td>${fmtN(mKm+mTr)}</td>
      <td>${fmtN(mFr)}</td><td>${fmtKr(mFradrag)}</td>
    </tr>`;
    grandTotal.km += mKm; grandTotal.transport += mTr; grandTotal.husstande += mHus;
    grandTotal.fradragsKm += mFr; grandTotal.fradrag += mFradrag;
    monthTrips = [];
  };

  for (const t of filtered) {
    const month = t.date.substring(0,7);
    if (month !== currentMonth) {
      flushMonth();
      currentMonth = month;
      const mParts = month.split('-');
      rows += `<tr class="month-header"><td colspan="9">${dkMonths[mParts[1]]||mParts[1]} ${mParts[0]}</td></tr>`;
    }
    monthTrips.push(t);
    const totalKm = t.totalRouteKm + t.totalTransportKm;
    const { fradragsKm, fradrag } = calcFradrag(totalKm);
    rows += `<tr>
      <td>${fmtD(t.date)}</td>
      <td>${t.routes.length}</td>
      <td style="font-size:10px">${t.routes.map(r=>r.postnr+'-'+r.rutenr).join(', ')}</td>
      <td>${t.totalHusstande}</td>
      <td>${fmtN(t.totalRouteKm)}</td>
      <td>${fmtN(t.totalTransportKm)}</td>
      <td>${fmtN(totalKm)}</td>
      <td>${fradragsKm > 0 ? fmtN(fradragsKm) : '-'}</td>
      <td>${fradrag > 0 ? fmtKr(fradrag) : '-'}</td>
    </tr>`;
  }
  flushMonth();

  const html = `<!DOCTYPE html>

// GLOBAL ERROR SAFETY NET — sørger for at ingen fejl fejler stille
// ═══════════════════════════════════════════════════════════
window.addEventListener('error', (e) => {
  console.error('Uncaught error:', e.error || e.message);
  try { showMsg('❌ Uventet fejl: ' + (e.message || 'ukendt'), 'error'); } catch {}
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Unhandled promise rejection:', e.reason);
  try { showMsg('❌ Uventet fejl: ' + (e.reason?.message || e.reason || 'ukendt'), 'error'); } catch {}
});
console.log('Rutetracker v' + CONFIG.VERSION + ' indlæst — build ' + new Date().toISOString());

async function init() {
  state.loading = true;
  render();
  
  // Load routes (public, no auth needed)
  await loadRoutes();
  
  // Init OAuth
  initAuth();
  
  state.loading = false;
  render();
}

init();
